name: Publish to NPM

on:
  push:
    branches:
      - master
    paths:
      - 'projects/ngx-linkifyjs-v2/**'
      - 'package.json'
      - 'README.md'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE_DIR: projects/ngx-linkifyjs-v2
      PACKAGE_NAME: "@code-name-jack/ngx-linkifyjs"
      DIST_DIR: dist/ngx-linkifyjs-v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Determine version to publish
        id: determine-version
        run: |
          # Install semver for version comparison
          npm install semver > /dev/null 2>&1 || true
          
          package_json="./${PACKAGE_DIR}/package.json"
          package_version=$(node -p "require('${package_json}').version")
          
          # Get latest version from npm
          npm_version=$(npm view "${PACKAGE_NAME}" version 2>/dev/null || echo "0.0.0")
          
          echo "package.json version: ${package_version}"
          echo "npm version: ${npm_version}"
          
          # Compare versions using semver
          comparison=$(node -e "
            const semver = require('semver');
            const pkgVer = '${package_version}';
            const npmVer = '${npm_version}';
            if (semver.gt(pkgVer, npmVer)) {
              console.log('package.json');
            } else if (semver.gt(npmVer, pkgVer)) {
              console.log('npm');
            } else {
              console.log('equal');
            }
          ")
          
          if [ "$comparison" = "npm" ]; then
            # npm version is higher, bump its patch
            new_version=$(node -e "
              const semver = require('semver');
              console.log(semver.inc('${npm_version}', 'patch'));
            ")
            echo "npm version (${npm_version}) is higher, bumping patch to: ${new_version}"
            
            # Update package.json with new version (without creating git tag)
            (cd "$PACKAGE_DIR" && npm version "$new_version" --no-git-tag-version)
            
            # Also update package-lock.json if it exists in the package directory
            if [ -f "${PACKAGE_DIR}/package-lock.json" ]; then
              node -e "
                const fs = require('fs');
                const lockFile = '${PACKAGE_DIR}/package-lock.json';
                const lock = JSON.parse(fs.readFileSync(lockFile, 'utf8'));
                lock.version = '${new_version}';
                fs.writeFileSync(lockFile, JSON.stringify(lock, null, 2) + '\n');
              "
            fi
            
            final_version="${new_version}"
          else
            echo "Using package.json version: ${package_version}"
            final_version="${package_version}"
          fi
          
          echo "Final version to publish: ${final_version}"
          echo "version=${final_version}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build library (production)
        run: npm run build:prod

      - name: Check if version exists on npm and bump if needed
        id: check-version
        run: |
          # Install semver if not already available
          npm install semver > /dev/null 2>&1 || true
          
          package_version=${{ steps.determine-version.outputs.version }}
          
          if npm view "${PACKAGE_NAME}@${package_version}" version > /dev/null 2>&1; then
            echo "Version ${package_version} already exists on npm, bumping patch version"
            
            # Bump the patch version
            new_version=$(node -e "
              const semver = require('semver');
              console.log(semver.inc('${package_version}', 'patch'));
            ")
            
            echo "Bumping version from ${package_version} to ${new_version}"
            
            # Update package.json with new version (without creating git tag)
            (cd "$PACKAGE_DIR" && npm version "$new_version" --no-git-tag-version)
            
            # Also update package-lock.json if it exists in the package directory
            if [ -f "${PACKAGE_DIR}/package-lock.json" ]; then
              node -e "
                const fs = require('fs');
                const lockFile = '${PACKAGE_DIR}/package-lock.json';
                const lock = JSON.parse(fs.readFileSync(lockFile, 'utf8'));
                lock.version = '${new_version}';
                fs.writeFileSync(lockFile, JSON.stringify(lock, null, 2) + '\n');
              "
            fi
            
            # Rebuild with the new version
            npm run build:prod
            
            final_version="${new_version}"
          else
            echo "Version ${package_version} is new and will be published"
            final_version="${package_version}"
          fi
          
          echo "package_version=${final_version}" >> "$GITHUB_OUTPUT"
          echo "Final version to publish: ${final_version}"

      - name: Publish to NPM
        run: npm publish "./${DIST_DIR}" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create and push tag after successful publish
          git tag -a "v${{ steps.check-version.outputs.package_version }}" -m "Release v${{ steps.check-version.outputs.package_version }}"
          git push origin "v${{ steps.check-version.outputs.package_version }}"

      - name: Extract CHANGELOG for this version
        id: changelog
        run: |
          VERSION=${{ steps.check-version.outputs.package_version }}
          if [ -f CHANGELOG.md ]; then
            CHANGELOG=$(awk "/## \[?${VERSION}\]?/,/## \[?[0-9]/" CHANGELOG.md | head -n -1 | tail -n +2)
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="See full changelog at [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)"
            fi
          else
            CHANGELOG="No changelog available"
          fi
          echo "$CHANGELOG" > /tmp/changelog.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.check-version.outputs.package_version }}
          name: Release v${{ steps.check-version.outputs.package_version }}
          body_path: /tmp/changelog.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish success notification
        run: |
          echo "Published ${PACKAGE_NAME}@${{ steps.check-version.outputs.package_version }} to npm"
          echo "npm: https://www.npmjs.com/package/${PACKAGE_NAME}/v/${{ steps.check-version.outputs.package_version }}"
          echo "GitHub Release: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.check-version.outputs.package_version }}"
