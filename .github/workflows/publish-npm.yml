name: Publish to NPM

on:
  push:
    branches:
      - master
    paths:
      - 'projects/ngx-linkifyjs-v2/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE_DIR: projects/ngx-linkifyjs-v2
      PACKAGE_NAME: "@code-name-jack/ngx-linkifyjs"
      DIST_DIR: dist/ngx-linkifyjs-v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Determine version to publish
        id: determine-version
        run: |
          package_json="./${PACKAGE_DIR}/package.json"
          package_version=$(node -p "require('${package_json}').version")
          latest_tag=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          latest_version=${latest_tag#v}

          echo "package.json version: ${package_version}"

          if [ -n "$latest_version" ]; then
            echo "latest tag: ${latest_tag}"
          fi

          new_version="${package_version}"

          if [ -n "$latest_version" ] && [ "$latest_version" = "$package_version" ]; then
            IFS='.' read -r major minor patch <<< "$package_version"
            new_version="${major}.${minor}.$((patch + 1))"
            (cd "$PACKAGE_DIR" && npm version "$new_version" --no-git-tag-version)
            echo "version bumped to ${new_version}"
          elif [ -n "$latest_version" ]; then
            highest=$(printf "%s\n%s" "$package_version" "$latest_version" | sort -V | tail -n1)
            if [ "$highest" != "$package_version" ]; then
              echo "::error::package.json version (${package_version}) is behind latest tag (${latest_version})."
              exit 1
            fi
          fi

          echo "version=${new_version}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build library (production)
        run: npm run build:prod

      - name: Check if version exists on npm
        id: check-version
        run: |
          package_version=${{ steps.determine-version.outputs.version }}
          echo "package_version=${package_version}" >> "$GITHUB_OUTPUT"

          if npm view "${PACKAGE_NAME}@${package_version}" version > /dev/null 2>&1; then
            echo "version_exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${package_version} already exists on npm"
          else
            echo "version_exists=false" >> "$GITHUB_OUTPUT"
            echo "Version ${package_version} is new"
          fi

      - name: Publish to NPM
        if: steps.check-version.outputs.version_exists == 'false'
        run: npm publish "${DIST_DIR}" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

      - name: Create Git tag
        if: steps.check-version.outputs.version_exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet "${PACKAGE_DIR}/package.json"; then
            git add "${PACKAGE_DIR}/package.json"
            git commit -m "chore: bump version to ${{ steps.determine-version.outputs.version }}"
            git push origin HEAD:${{ github.ref_name }}
          fi

          git tag -a "v${{ steps.determine-version.outputs.version }}" -m "Release v${{ steps.determine-version.outputs.version }}"
          git push origin "v${{ steps.determine-version.outputs.version }}"

      - name: Extract CHANGELOG for this version
        if: steps.check-version.outputs.version_exists == 'false'
        id: changelog
        run: |
          VERSION=${{ steps.determine-version.outputs.version }}
          if [ -f CHANGELOG.md ]; then
            CHANGELOG=$(awk "/## \[?${VERSION}\]?/,/## \[?[0-9]/" CHANGELOG.md | head -n -1 | tail -n +2)
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="See full changelog at [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)"
            fi
          else
            CHANGELOG="No changelog available"
          fi
          echo "$CHANGELOG" > /tmp/changelog.txt

      - name: Create GitHub Release
        if: steps.check-version.outputs.version_exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.determine-version.outputs.version }}
          name: Release v${{ steps.determine-version.outputs.version }}
          body_path: /tmp/changelog.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish success notification
        if: steps.check-version.outputs.version_exists == 'false'
        run: |
          echo "Published ${PACKAGE_NAME}@${{ steps.determine-version.outputs.version }} to npm"
          echo "npm: https://www.npmjs.com/package/${PACKAGE_NAME}/v/${{ steps.determine-version.outputs.version }}"
          echo "GitHub Release: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.determine-version.outputs.version }}"

      - name: Version already published
        if: steps.check-version.outputs.version_exists == 'true'
        run: |
          echo "::warning::Version ${{ steps.determine-version.outputs.version }} already exists on npm. Skipping publish."
          exit 0
